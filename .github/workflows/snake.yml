name: generate snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: Tayyab-Ali-786
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&color_dots=#111111,#3a3a3a,#6b6b6b,#a3a3a3,#ffffff
            dist/snake-light.svg?palette=github-light&color_snake=#000000&color_dots=#ebedf0,#c4c4c4,#8a8a8a,#4d4d4d,#000000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
